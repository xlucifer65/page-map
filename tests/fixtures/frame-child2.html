<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Second folder</title></head>
<body>
  <main>
    <h1>Second folder</h1>
    <button id="deep">Deep file</button>
    <p id="status"></p>
    <script>
      document.getElementById('deep').addEventListener('click', () => {
        document.getElementById('status').textContent = 'opened Deep file';
      });
    </script>
  </main>
</body>
</html>
