<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SharePoint Files</title></head>
<body>
  <main>
    <h1>Shared files</h1>
    <button id="course">Course 1</button>
    <a href="frame-child2.html">Next folder</a>
    <p id="status"></p>
    <script>
      document.getElementById('course').addEventListener('click', () => {
        document.getElementById('status').textContent = 'selected Course 1';
        if (!document.getElementById('open-course')) {
          const open = document.createElement('button');
          open.id = 'open-course';
          open.textContent = 'Open Course 1';
          open.addEventListener('click', () => {
            document.getElementById('status').textContent = 'opened Course 1';
          });
          document.querySelector('main').appendChild(open);
        }
      });
    </script>
  </main>
</body>
</html>
